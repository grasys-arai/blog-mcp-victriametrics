---
- name: Restart Grafana
  ansible.builtin.systemd_service:
    name: grafana-server
    state: restarted

- name: Restart monitoring services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop: [victoriametrics, mcp-victoriametrics, grafana-server, alloy]
