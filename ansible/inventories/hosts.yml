---
all:
  vars:
    ansible_user: YOUR_SSH_USERNAME
    ansible_ssh_private_key_file: /PATH/TO/YOUR_SSH_PRIVATE_KEY

  children:
    app:
      hosts:
        app01:
          ansible_host: YOUR_APP_SERVER_PUBLIC_IP

    monitor:
      hosts:
        monitor01:
          ansible_host: YOUR_MONITOR_SERVER_PUBLIC_IP
          internal_ip: YOUR_MONITOR_SERVER_INTERNAL_IP